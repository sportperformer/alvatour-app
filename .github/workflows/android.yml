# Build i wydania AlvaTour (Android).
#
# - pull request:        testy + kontrolny build (bez wydania)
# - push do main:        testy + podpisane APK + WERSJA TESTOWA w GitHub Releases (pre-release, tag v<wersja>-test.<nr>)
# - ręcznie z "produkcja": testy + podpisane APK + WERSJA PRODUKCYJNA (tag v<wersja>)
#
# Jeśli testy nie przejdą, nie ma buildu ani wydania.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      produkcja:
        description: 'Wydaj wersję produkcyjną (tylko po sprawdzeniu wersji DEV)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Android SDK (preinstalowane na runnerze, dokładamy platformę 36)
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Wersja
        id: ver
        env:
          PRODUKCJA: ${{ github.event_name == 'workflow_dispatch' && inputs.produkcja }}
        run: |
          base=$(node -p "require('./package.json').version")
          if [ "$PRODUKCJA" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Wersję produkcyjną wydajemy tylko z gałęzi main."; exit 1; fi
            if git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then echo "::error::Wersja v$base już istnieje. Podnieś wersję w package.json."; exit 1; fi
            version="$base"; prerelease=false
          else
            version="$base-test.$GITHUB_RUN_NUMBER"; prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Wersja: $version (versionCode $GITHUB_RUN_NUMBER)"

      - name: Klucz podpisu
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALVATOUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "Brak klucza: kontrolny build bez podpisu (bez wydania)."; echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::Brak sekretu ALVATOUR_KEYSTORE_BASE64. Wydanie wymaga klucza podpisu."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alvatour.p12"
          echo "ALVATOUR_KEYSTORE_FILE=$RUNNER_TEMP/alvatour.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - name: Pliki aplikacji (www) i synchronizacja z Androidem
        env:
          ALVATOUR_VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: |
          npm run build
          npx cap sync android

      - name: Build APK (prod i DEV)
        working-directory: android
        env:
          ALVATOUR_KEYSTORE_PASSWORD: ${{ secrets.ALVATOUR_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleProdRelease assembleDevRelease \
            -PalvatourVersionName="${{ steps.ver.outputs.version }}" \
            -PalvatourVersionCode="$GITHUB_RUN_NUMBER"

      - name: Sprawdzenie podpisu (zawsze ten sam klucz)
        if: steps.key.outputs.signed == 'true'
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          expected=$(tr -d ' :\n' < android/signing-cert-sha256.txt | tr 'A-F' 'a-f')
          for apk in android/app/build/outputs/apk/*/release/*.apk; do
            "$apksigner" verify "$apk"
            got=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$got" != "$expected" ]; then
              echo "::error::$apk jest podpisany INNYM kluczem ($got). Aktualizacja na telefonie by się nie zainstalowała."; exit 1
            fi
          done
          echo "Podpis zgodny: $expected"

      - name: Nazwy plików
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          prod=$(ls android/app/build/outputs/apk/prod/release/*.apk | head -1)
          dev=$(ls android/app/build/outputs/apk/dev/release/*.apk | head -1)
          cp "$prod" "dist/AlvaTour-$v.apk"
          cp "$dev" "dist/AlvaTour-DEV-$v.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30

  release:
    name: Wydanie w GitHub Releases
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.build.outputs.version }}
          path: dist
      - name: Opis wydania
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: node scripts/release-notes.mjs "$VERSION" "$PRERELEASE" > notes.md && cat notes.md
      - name: Publikacja
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; title="AlvaTour $VERSION (wersja testowa)"; else flags="--latest"; title="AlvaTour $VERSION"; fi
          gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "$title" --notes-file notes.md $flags
